<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Cast</title>
    <style>
      body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          background-color: gray;
          overflow: hidden;
          display: flex;
          justify-content: center;
          align-items: center;
      }
      canvas {
          width: min(1920px, 100vw);
          height: auto;
          max-height: 100vh;
          aspect-ratio: 16 / 9;
          object-fit: contain;
          background-color: black;
          display: block;
          position: relative;
      }

      @media (max-width: 768px) {
          body, html {
              width: 100%;
              height: 100%;
          }

          canvas {
              width: 100vw;
              height: auto;
              max-width: 100vw;
              max-height: 100vh;
              object-fit: contain;
          }
      }

      @media (min-width: 769px) {
          canvas {
              max-width: 100vw;
              max-height: 100vh;
          }
      }
      #startButton {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          padding: 1em 2em;
          font-size: 1.5em;
          color: white;
          background: #007bff;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          z-index: 1000;
      }
      #fullscreenToggle {
          position: absolute;
          bottom: 10%;
          right: 10%;
          width: 50px;
          height: 50px;
          background-color: #ff573340;
          border: none;
          border-radius: 50%;
          cursor: grab;
          z-index: 1001;
      }
    </style>
  </head>
  <body>
    <button id="startButton">Start Fullscreen</button>
    <button id="fullscreenToggle"></button>
    <canvas id="videoCanvas" width="1920" height="1080"></canvas>
    <script src="client.js"></script>
  </body>
</html>
